# Optional override: publishes the LND watchtower port on the host.
# Needed only with WATCHTOWER=true in clearnet mode (with Tor the tower is
# reached through its onion address and no host port is required).
# Enable it by adding this line to .env, so every "docker compose" command
# (including the scripts) picks it up:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.watchtower.yml
services:
    lit:
        ports:
          - 9911:9911
